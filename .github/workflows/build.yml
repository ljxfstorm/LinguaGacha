name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "目标分支/标签/提交"
        required: true
        default: "feat/built-in-proxy-settings"
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check_version.outputs.version }}
      app_name: ${{ steps.app_meta.outputs.app_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check Version
        id: check_version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve App Meta
        id: app_meta
        shell: bash
        run: |
          echo "app_name=LinguaGacha" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: buildtools/builder/win-cli/go.mod
          cache-dependency-path: buildtools/builder/**/go.mod

      - name: Sync Manifest Versions
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        shell: bash
        run: |
          npm ci

      - name: Build Electron Zip Package
        shell: bash
        run: |
          npm run build -- --win zip --x64 --publish never

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}_Windows_x64
          compression-level: 0
          path: |
            build/release/${{ needs.prepare.outputs.version }}/LinguaGacha_v${{ needs.prepare.outputs.version }}_Windows_x64.zip
